<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Yakup Enes Güven | Portfolio</title>
    <!--
      GitHub Pages has no server-side rewrite, so it serves this file for any
      unknown path. We encode the requested path into a query string and bounce
      to index.html, which decodes it back before React Router boots.
      Single-page app trick from https://github.com/rafgraph/spa-github-pages
      pathSegmentsToKeep = 1 because the site is served from /site/.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
